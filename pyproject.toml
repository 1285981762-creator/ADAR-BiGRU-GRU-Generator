[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adar-bigru-gru-generator"
version = "1.0.0"
description = "Score-conditioned BiGRU-GRU generator for ADAR complementary RNA candidates"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "rapidfuzz>=3.0",
]

[project.scripts]
adar-bigru-generate = "adar_bigru.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["adar_bigru*"]

[tool.setuptools.package-data]
adar_bigru = ["weights/*.pt"]
